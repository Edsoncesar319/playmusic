<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>Entrar - Musickera</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background: #111;
            color: #fff;
            font-family: Roboto, sans-serif;
        }

        .auth-panel {
            width: min(520px, 100%);
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            background: #181818;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.32);
        }

        h1 {
            margin: 0 0 8px;
            color: #1ed760;
            font-size: 30px;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .auth-description {
            margin: 0 0 20px;
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.5;
        }

        .auth-form {
            display: grid;
            gap: 14px;
        }

        .auth-form label {
            display: grid;
            gap: 6px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .auth-form input {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 10px;
            outline: none;
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
        }

        .auth-form input:focus {
            border-color: #1DB954;
            box-shadow: 0 0 0 2px rgba(29, 185, 84, 0.18);
        }

        .auth-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 4px;
        }

        .auth-button {
            min-height: 42px;
            padding: 9px 16px;
            border: 0;
            border-radius: 999px;
            background: #1DB954;
            color: #07190d;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-button.secondary {
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: transparent;
            color: #fff;
        }

        .auth-view[hidden] {
            display: none;
        }

        .auth-message {
            min-height: 1.4em;
            margin: 12px 0 0;
            color: #ffb4ab;
        }

        .material-symbols-rounded {
            display: inline-flex;
            vertical-align: middle;
            font-size: 20px;
        }

        @media (max-width: 480px) {
            .auth-panel {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <main class="auth-panel" aria-live="polite">
        <h1>Musickera</h1>
        <section class="auth-view" id="loginView">
            <h2>Entrar</h2>
            <p class="auth-description">Entre para acessar sua biblioteca e enviar músicas.</p>
            <form class="auth-form" id="loginForm">
                <label>E-mail
                    <input type="email" name="email" autocomplete="email" maxlength="254" required>
                </label>
                <label>Senha
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>
                <div class="auth-actions">
                    <button class="auth-button" type="submit"><span class="material-symbols-rounded" aria-hidden="true">login</span> Entrar</button>
                    <button class="auth-button secondary" type="button" id="showRegister">Criar conta</button>
                </div>
            </form>
        </section>
        <section class="auth-view" id="registerView" hidden>
            <h2>Criar conta</h2>
            <p class="auth-description">A senha deve ter pelo menos 12 caracteres.</p>
            <form class="auth-form" id="registerForm">
                <label>Nome
                    <input type="text" name="displayName" autocomplete="name" maxlength="80" required>
                </label>
                <label>E-mail
                    <input type="email" name="email" autocomplete="email" maxlength="254" required>
                </label>
                <label>Senha
                    <input type="password" name="password" autocomplete="new-password" minlength="12" maxlength="128" required>
                </label>
                <div class="auth-actions">
                    <button class="auth-button" type="submit"><span class="material-symbols-rounded" aria-hidden="true">person_add</span> Criar conta</button>
                    <button class="auth-button secondary" type="button" id="showLogin">Já tenho conta</button>
                </div>
            </form>
        </section>
        <p class="auth-message" id="authMessage" role="status"></p>
    </main>
    <script>
        function setAuthMessage(message) {
            document.getElementById('authMessage').textContent = message;
        }

        function showAuthView(viewName) {
            document.getElementById('loginView').hidden = viewName !== 'login';
            document.getElementById('registerView').hidden = viewName !== 'register';
            setAuthMessage('');
        }

        async function sendAuthRequest(url, payload) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify(payload)
            });
            let result = {};
            try {
                result = await response.json();
            } catch {
                result = {};
            }
            if (!response.ok) {
                throw new Error(result.error || `A API respondeu com status ${response.status}.`);
            }
            return result;
        }

        async function submitAuthForm(event, endpoint) {
            event.preventDefault();
            const form = event.currentTarget;
            const payload = Object.fromEntries(new FormData(form));
            try {
                await sendAuthRequest(endpoint, payload);
                window.location.replace('/');
            } catch (error) {
                setAuthMessage(error.message);
            }
        }

        document.getElementById('showRegister').addEventListener('click', () => showAuthView('register'));
        document.getElementById('showLogin').addEventListener('click', () => showAuthView('login'));
        document.getElementById('loginForm').addEventListener('submit', event => {
            submitAuthForm(event, '/api/auth/login');
        });
        document.getElementById('registerForm').addEventListener('submit', event => {
            submitAuthForm(event, '/api/auth/register');
        });

        const message = new URLSearchParams(window.location.search).get('message');
        if (message) setAuthMessage(message);

        fetch('/api/auth/me', { credentials: 'same-origin' })
            .then(response => {
                if (response.ok) window.location.replace('/');
                else if (response.status !== 401) {
                    setAuthMessage(`Não foi possível verificar a sessão (HTTP ${response.status}).`);
                }
            })
            .catch(error => {
                console.error('Falha ao verificar a sessão:', error);
                setAuthMessage('Não foi possível conectar à autenticação. Verifique a conexão com o servidor.');
            });
    </script>
</body>
</html>
