                        cover: cover,
                        file: arrayBuffer,
                        fileType: file.type,
                        fileName: file.name,
                        blobId: blobId,
                        trackNumber: playlist.length + 1
                    };
                    const extension = file.name.match(/\.[^.]+$/)?.[0] || '';
                    const blobFileName = sanitizeBlobFileName(
                        `${music.artist} -- ${music.album} -- ${music.title}${extension}`
                    );

                    const remoteMusic = await uploadToBackend(file, `music/${blobId}/${blobFileName}`);
                    music.file = remoteMusic.url;

                    if (remoteMusic && cover.startsWith('data:') && cover !== defaultCover) {
                        try {
                            const coverFile = await (await fetch(cover)).blob();
                            const extension = getImageExtension(coverFile.type);
                            const uploadedCover = await uploadToBackend(
                                new File([coverFile], `cover.${extension}`, { type: coverFile.type }),
                                `covers/${blobId}/cover.${extension}`
                            );
                            music.cover = uploadedCover.url;
                        } catch (error) {
                            console.error('Falha ao enviar a capa incorporada para o Vercel Blob:', error);
                        }
                    }

                    // Salva no banco de dados
                    const id = await saveMusicToDB({ ...music, file: arrayBuffer });
                    music.id = id;

                    // Mantém o áudio disponível localmente mesmo com a cópia remota.
                    music.file = URL.createObjectURL(new Blob([arrayBuffer], { type: file.type }));

                    // Adiciona à playlist
                    playlist.push(music);
                    sortPlaylist();

                    // Atualiza a duração
                    const audio = new Audio(music.file);
                    audio.addEventListener('loadedmetadata', () => {
                        const minutes = Math.floor(audio.duration / 60);
                        const seconds = Math.floor(audio.duration % 60);
                        music.duration = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                        sortPlaylist();
                        updatePlaylistHTML();
                    });

                    if (playlist.length === 1) {
                        currentTrack = 0;
                        loadTrack();
                    }
                } catch (error) {
                    console.error('Erro ao processar arquivo:', error);
                    alert(`Não foi possível inserir ${file.name}: ${error.message}`);
                }
            }

            event.target.value = '';
        }

        function sanitizeBlobFileName(fileName) {
            const extension = fileName.match(/\.[^.]+$/)?.[0] || '';
            const baseName = (extension ? fileName.slice(0, -extension.length) : fileName)
                .replace(/[\/\\\0-\x1f\x7f]/g, '_')
                .replace(/[^\p{L}\p{N}._ -]/gu, '_')
                .replace(/\s+/g, ' ')
                .trim();
            const safeBaseName = (baseName && baseName !== '.' && baseName !== '..' ? baseName : 'media')
                .slice(0, 180 - extension.length);
            return encodeURIComponent(`${safeBaseName}${extension}`);
        }

        function getImageExtension(contentType) {
            const extensions = {
                'image/gif': 'gif',
                'image/jpeg': 'jpg',
                'image/png': 'png',
                'image/webp': 'webp'
            };
            const extension = extensions[contentType];
            if (!extension) {
                throw new Error('Formato de imagem não permitido.');
            }
            return extension;
        }

        async function getStorageProvider() {
            if (!storageProviderPromise) {
                storageProviderPromise = fetch('/api/health')
                    .then(async response => {
                        if (!response.ok) {
                            throw new Error(`A API respondeu com status ${response.status}.`);
                        }
                        const { storage } = await response.json();
                        if (storage !== 'local' && storage !== 'vercel') {
                            throw new Error('O servidor não informou o tipo de armazenamento configurado.');
                        }
                        return storage;
                    })
                    .catch(error => {
                        storageProviderPromise = null;
                        throw error;
                    });
            }
            return storageProviderPromise;
        }

        async function uploadToBackend(file, pathname) {
            if (await getStorageProvider() === 'vercel') {
                const { uploadPresigned } = await import('/blob-client.js');
                return uploadPresigned(pathname, file, {
                    handleUploadUrl: '/api/upload',
                    access: 'public',
                    multipart: file.size > 5 * 1024 * 1024
                });
            }

            const formData = new FormData();
            formData.append('pathname', pathname);
            formData.append('file', file);
            const response = await fetch('/api/upload', {
                method: 'POST',
                credentials: 'same-origin',
                body: formData
            });
            let result = {};
            try {
                result = await response.json();
            } catch {
                result = {};
            }
            if (!response.ok) {
                throw new Error(result.error || `A API respondeu com status ${response.status}.`);
            }
            return result;
        }

        async function sendMusicRequest(url, method, payload) {
            const options = { method, credentials: 'same-origin' };
            if (payload !== undefined) {
                options.headers = { 'Content-Type': 'application/json' };
                options.body = JSON.stringify(payload);
            }
            const response = await fetch(url, options);
            let result = {};
            try {
                result = await response.json();
            } catch {
                result = {};
            }
            if (!response.ok) {
                const error = new Error(result.error || `A API respondeu com status ${response.status}.`);
                error.status = response.status;
                throw error;
            }
            return result;
        }

        async function editTrack(index) {
            const track = playlist[index];
            if (!track) return;
            const selectedTrack = playlist[currentTrack];
            const title = prompt('Título da música:', track.title);
            if (title === null) return;
            const artist = prompt('Artista:', track.artist);
            if (artist === null) return;
            const album = prompt('Álbum:', track.album);
            if (album === null) return;

            const updatedTrack = { ...track, title: title.trim(), artist: artist.trim(), album: album.trim() };
            if (!updatedTrack.title || !updatedTrack.artist || !updatedTrack.album) {
                alert('Título, artista e álbum são obrigatórios.');
                return;
            }
            try {
                if (track.blobId) {
                    await sendMusicRequest(`/api/music/${encodeURIComponent(track.blobId)}`, 'PATCH', {
                        title: updatedTrack.title,
                        artist: updatedTrack.artist,
                        album: updatedTrack.album
                    });
                }
                if (track.id) await updateMusicInDB(updatedTrack);
                Object.assign(track, updatedTrack);
                sortPlaylist();
                currentTrack = playlist.indexOf(selectedTrack);
                updatePlaylistHTML();
            } catch (error) {
                if (error.status === 401) clearUserState('Sua sessão expirou. Entre novamente.');
                else alert(`Não foi possível atualizar a música: ${error.message}`);
            }
        }

        // Função para atualizar a lista de músicas do diretório
        async function updateMusicList() {
            if (!currentUser) return;
            try {
                const response = await fetch('/api/music');
                if (response.status === 401) {
                    clearUserState('Sua sessão expirou. Entre novamente.');
                    return;
                }
                if (!response.ok) {
                    throw new Error(`A API respondeu com status ${response.status}.`);
                }

                const data = await response.json();
                for (const music of data.music) {
                    const existingIndex = playlist.findIndex(track => track.blobId === music.blobId);
                    if (existingIndex >= 0) {
                        const existingTrack = playlist[existingIndex];
                        playlist[existingIndex] = {
                            ...music,
                            ...existingTrack,
                            file: existingTrack.file,
                            cover: music.cover || existingTrack.cover,
                            blobId: music.blobId
                        };
                        continue;
                    }

                    music.cover = music.cover || defaultCover;
                    playlist.push(music);
                }

                sortPlaylist();
                updateDurations();
            } catch (error) {
                console.error('Erro ao atualizar a biblioteca remota:', error);
            }
        }

        // Atualiza a biblioteca remota periodicamente.
        setInterval(() => {
            if (currentUser) updateMusicList();
        }, 30000);

        // Função para tocar uma música específica
        function playTrack(index) {
            currentTrack = index;
            loadTrack();
            if (!isPlaying) {
                togglePlay();
            }
        }

        // Inicializa o player
        updatePlaylistHTML();

        function toggleRepeat() {
            const repeatButton = document.getElementById('repeatButton');
            const repeatIcon = document.getElementById('repeatIcon');
            switch (repeatMode) {
                case 'none':
                    repeatMode = 'one';
                    repeatButton.classList.add('active');
                    repeatIcon.textContent = 'repeat_one';
                    break;
                case 'one':
                    repeatMode = 'all';
                    repeatButton.classList.add('active');
                    repeatIcon.textContent = 'repeat';
                    break;
                case 'all':
                    repeatMode = 'none';
                    repeatButton.classList.remove('active');
                    repeatIcon.textContent = 'repeat';
                    break;
            }
        }

        // Adiciona o evento de redimensionamento
        window.addEventListener('resize', adjustFontSize);

        // Função para salvar a playlist no localStorage
        function savePlaylist() {
            if (!currentUser) return;
            const playlistData = playlist.map(track => ({
                ...track,
                file: track.file // Salva a URL do arquivo
            }));
            localStorage.setItem(`musickeraPlaylist:${currentUser.id}`, JSON.stringify(playlistData));
        }

        // Função para carregar a playlist do localStorage
        function loadPlaylist() {
            if (!currentUser) return;
            const savedPlaylist = localStorage.getItem(`musickeraPlaylist:${currentUser.id}`);
            if (savedPlaylist) {
                const parsedPlaylist = JSON.parse(savedPlaylist);
                playlist.length = 0; // Limpa a playlist atual
                parsedPlaylist.forEach(track => {
                    playlist.push(track);
                });
                updatePlaylistHTML();
                if (playlist.length > 0) {
                    currentTrack = 0;
                    loadTrack();
                }
            }
        }

        // Função para remover uma música da playlist
        async function removeTrack(index) {
            const track = playlist[index];
            if (!track) return;

            if (index === currentTrack) {
                // Se estiver removendo a música atual, para a reprodução
                audio.pause();
                isPlaying = false;
            }
            
            try {
                if (track.blobId) {
                    await sendMusicRequest(`/api/music/${encodeURIComponent(track.blobId)}`, 'DELETE');
                }
            } catch (error) {
                if (error.status === 401) clearUserState('Sua sessão expirou. Entre novamente.');
                else alert(`Não foi possível remover a música: ${error.message}`);
                return;
            }

            if (track.id) {
                try {
                    await removeMusicFromDB(track.id);
                } catch (error) {
                    console.error('Erro ao remover música do banco de dados:', error);
                }
            }
            
            playlist.splice(index, 1);
            
            if (currentTrack >= index && currentTrack > 0) {
                currentTrack--;
            }
            
            sortPlaylist();
            updatePlaylistHTML();
            
            if (playlist.length > 0) {
                loadTrack();
            } else {
                document.querySelector('.track-title').textContent = "Nenhuma música";
                document.querySelector('.artist-name').textContent = "";
                document.querySelector('.album-name').textContent = "";
                document.querySelector('.album-cover').src = defaultCover;
                document.querySelector('.progress-bar').style.width = "0%";
                document.querySelector('.current-time').textContent = "0:00";
                document.querySelector('.duration').textContent = "0:00";
            }
        }

        // Função para limpar toda a playlist
        async function clearPlaylist() {
            if (confirm("Limpar as músicas locais deste navegador? As músicas do Blob continuarão disponíveis.")) {
                try {
                    await clearMusicDB();
                    
                    audio.pause();
                    isPlaying = false;

                    const blobTracks = playlist.filter(track => track.blobId);
                    playlist.length = 0;
                    playlist.push(...blobTracks);
                    currentTrack = 0;
                    
                    updatePlaylistHTML();

                    if (playlist.length > 0) {
                        loadTrack();
                    } else {
                        document.querySelector('.track-title').textContent = "Nenhuma música";
                        document.querySelector('.artist-name').textContent = "";
                        document.querySelector('.album-name').textContent = "";
                        document.querySelector('.album-cover').src = defaultCover;
                        document.querySelector('.progress-bar').style.width = "0%";
                        document.querySelector('.current-time').textContent = "0:00";
                        document.querySelector('.duration').textContent = "0:00";
                    }
                } catch (error) {
                    console.error('Erro ao limpar banco de dados:', error);
                    alert('Erro ao limpar a playlist');
                }
            }
        }

        // Função para carregar a playlist do banco de dados ao iniciar
        async function loadPlaylistFromDB() {
            try {
                const musics = await loadMusicsFromDB();
                playlist.length = 0;
                
                for (const music of musics) {
                    // Cria URL do blob para reprodução
                    const blob = new Blob([music.file], { type: music.fileType });
                    music.file = URL.createObjectURL(blob);
                    playlist.push(music);
                }
                
                updatePlaylistHTML();
                await updateMusicList();
                for (const customPlaylist of customPlaylists) {
                    for (const key of customPlaylist.trackKeys) {
                        if (playlist.some(track => getTrackKey(track) === key)) continue;
                        const savedTrack = customPlaylist.trackData[key];
                        if (savedTrack) playlist.push({ ...savedTrack });
                    }
                }
                sortPlaylist();
                if (playlist.length > 0) {
                    currentTrack = 0;
                    loadTrack();
                }
            } catch (error) {
                console.error('Erro ao carregar playlist do banco de dados:', error);
            }
        }

        // Inicializa o banco de dados e carrega a playlist local e remota.
        initializeAuthentication();

        const platformSelector = document.getElementById('platformSelector');
        const searchResults = document.getElementById('searchResults');
        let activeSearchId = 0;

        function getOfficialSearchUrl(query, platform) {
            const encodedQuery = encodeURIComponent(query);
            return platform === 'youtube'
                ? `https://music.youtube.com/search?q=${encodedQuery}`
                : `https://www.deezer.com/search/${encodedQuery}`;
        }

        function getSupportedMusicUrl(value) {
            try {
                const url = new URL(value);
                const host = url.hostname.toLowerCase();
                const supportedHost = host === 'deezer.com' || host.endsWith('.deezer.com') ||
                    host === 'youtube.com' || host.endsWith('.youtube.com') || host === 'youtu.be';
                return url.protocol === 'https:' && supportedHost ? url.href : '';
            } catch {
                return '';
            }
        }

        async function searchPlatform(query, platform) {
            const normalizedQuery = query.trim();
            const searchId = ++activeSearchId;
            if (platform === 'library') {
                searchResults.style.display = 'none';
                filterPlaylist(normalizedQuery);
                return;
            }
            if (!normalizedQuery) {
                searchResults.style.display = 'none';
                return;
            }

            const directUrl = getSupportedMusicUrl(normalizedQuery);
            if (directUrl) {
                displaySearchMessage(
                    'Link reconhecido. Abra-o no serviço oficial para ouvir ou acessar a playlist.',
                    directUrl,
                    platform
                );
                return;
            }

            if (platform === 'youtube') {
                displaySearchMessage(
                    'A busca do YouTube Music abre os resultados oficiais. Playlists e vídeos permanecem no serviço.',
                    getOfficialSearchUrl(normalizedQuery, platform),
                    platform
                );
                return;
            }

            searchResults.innerHTML = '<div class="search-result-message" role="status">Buscando no Deezer...</div>';
            searchResults.style.display = 'block';

            try {
                const response = await fetch(`https://api.deezer.com/search?q=${encodeURIComponent(normalizedQuery)}`);
                if (!response.ok) throw new Error(`O Deezer respondeu com status ${response.status}.`);
                const data = await response.json();
                if (data.error) throw new Error(data.error.message || 'A busca do Deezer falhou.');
                if (searchId !== activeSearchId) return;

                const results = (Array.isArray(data.data) ? data.data : []).map(track => ({
                    id: track.id,
                    title: track.title,
                    artist: track.artist?.name || 'Artista desconhecido',
                    cover: track.album?.cover_medium || '',
                    album: track.album?.title || '',
                    url: track.link
                }));
                displaySearchResults(results, normalizedQuery);
            } catch (error) {
                console.error('Erro na busca:', error);
                if (searchId !== activeSearchId) return;
                displaySearchMessage(
                    'Não foi possível carregar os resultados da busca agora. Você pode continuar no site oficial.',
                    getOfficialSearchUrl(normalizedQuery, platform),
                    platform
                );
            }
        }

        function displaySearchMessage(message, url, platform) {
            const safeUrl = getSupportedMusicUrl(url);
            if (!safeUrl) {
                searchResults.innerHTML = `<div class="search-result-message">${escapeHTML(message)}</div>`;
                searchResults.style.display = 'block';
                return;
            }
            const serviceName = new URL(safeUrl).hostname.endsWith('youtube.com')
                ? 'YouTube Music'
                : platform === 'youtube' ? 'YouTube Music' : 'Deezer';
            searchResults.innerHTML = `
                <div class="search-result-message">
                    ${escapeHTML(message)}
                    <p><a class="search-result-link" href="${escapeHTML(safeUrl)}"
                        target="_blank" rel="noopener noreferrer">Abrir busca no ${serviceName}</a></p>
                </div>`;
            searchResults.style.display = 'block';
        }

        function displaySearchResults(results, query) {
            if (results.length === 0) {
                displaySearchMessage(
                    'Nenhuma faixa encontrada. Também é possível buscar diretamente no site oficial.',
                    getOfficialSearchUrl(query, 'deezer'),
                    'deezer'
                );
                return;
            }

            searchResults.innerHTML = results.map(result => `
                <div class="search-result-item">
                    ${result.cover ? `<img src="${escapeHTML(result.cover)}" alt="" class="search-result-cover">` : ''}
                    <div class="search-result-info">
                        <div class="search-result-title">${escapeHTML(result.title)}</div>
                        <div class="search-result-artist">${escapeHTML(result.artist)}${result.album ? ` · ${escapeHTML(result.album)}` : ''}</div>
                    </div>
                    <a class="search-result-link" href="${escapeHTML(getSupportedMusicUrl(result.url))}"
                        target="_blank" rel="noopener noreferrer">Abrir</a>
                    <button type="button" data-deezer-id="${escapeHTML(result.id)}">Adicionar à fila</button>
                </div>
            `).join('');
            searchResults.style.display = 'block';
        }

        async function importTrack(platform, id) {
            try {
                if (platform === 'deezer') {
                    const response = await fetch(`https://api.deezer.com/track/${id}`);
                    if (!response.ok) throw new Error(`O Deezer respondeu com status ${response.status}.`);
                    const track = await response.json();
                    
                    if (track.error) throw new Error(track.error.message);
                    if (!track.preview || !track.link) {
                        throw new Error('A faixa não possui uma prévia disponível no Deezer.');
                    }

                    const existingIndex = playlist.findIndex(item =>
                        item.source === 'deezer' && String(item.deezerId) === String(track.id)
                    );
                    if (existingIndex >= 0) {
                        currentTrack = existingIndex;
                        loadTrack();
                        searchResults.style.display = 'none';
                        return;
                    }

                    const newTrack = {
                        title: track.title,
                        artist: track.artist.name,
                        album: track.album.title,
                        duration: formatDuration(track.duration),
                        cover: track.album.cover_medium,
                        file: track.preview,
                        trackNumber: playlist.length + 1,
                        source: 'deezer',
                        deezerId: track.id,
                        deezer_link: track.link
                    };

                    playlist.push(newTrack);
                    sortPlaylist();
                    updatePlaylistHTML();
                    
                    if (playlist.length === 1) {
                        currentTrack = 0;
                        loadTrack();
                    }
                } else if (platform === 'youtube') {
                    window.open(`https://music.youtube.com/watch?v=${encodeURIComponent(id)}`, '_blank', 'noopener,noreferrer');
                }

                searchResults.style.display = 'none';
            } catch (error) {
                console.error('Erro ao importar música:', error);
                alert(`Não foi possível adicionar a faixa: ${error.message}`);
            }
        }

        searchResults.addEventListener('click', event => {
            const importButton = event.target.closest('[data-deezer-id]');
            if (!importButton) return;
            event.stopPropagation();
            importTrack('deezer', importButton.dataset.deezerId);
        });

        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const platform = platformSelector.value;
                searchPlatform(searchInput.value, platform);
            }, 300);
        });

        // Close search results when clicking outside
        document.addEventListener('click', function(e) {
            if (!searchResults.contains(e.target) && e.target !== searchInput) {
                searchResults.style.display = 'none';
            }
        });

        // Update platform selector event listener
        platformSelector.addEventListener('change', function() {
            if (searchInput.value.trim()) {
                searchPlatform(searchInput.value, this.value);
            } else if (this.value === 'library') {
                updatePlaylistHTML();
            }
        });
    </script>
</body>
</html>
